<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selva | Amazon Account Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--nav-h:76px;--ink:#43202a;--muted:#8c5d69;--font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:#f7ecee;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* demo nav: replace with your real navigation, keep --nav-h in sync */
.nav{position:absolute;z-index:10;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,80px);font-size:14px;font-weight:600;letter-spacing:.02em}
.nav a{color:var(--ink);text-decoration:none;opacity:.8;margin-left:28px}
.nav a:first-child{margin:0;opacity:1}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;isolation:isolate;
  background:linear-gradient(90deg,#b9808c 0%,#d7a5af 13%,#ecd0d5 28%,#faf1f3 41%,#fff 50%,#faf1f3 59%,#ecd0d5 72%,#d7a5af 87%,#b9808c 100%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 36% 62% at 50% 50%,#fff 0%,rgba(255,255,255,.96) 40%,rgba(255,255,255,0) 100%),
             radial-gradient(120% 90% at 50% 45%,rgba(255,255,255,0) 55%,rgba(140,70,85,.10) 100%)}
.wrap{position:absolute;left:50%;bottom:0;height:min(calc(100vh - var(--nav-h) - 12px),920px);height:min(calc(100svh - var(--nav-h) - 12px),920px);
  aspect-ratio:1230/1040;transform:translateX(-43%);opacity:0;transition:opacity .8s ease}
.wrap.ready{opacity:1}
.wrap::before{content:"";position:absolute;inset:-6% -8% 0 -8%;z-index:-1;background:radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.9) 45%,rgba(255,255,255,0) 100%)}
.wrap::after{content:"";position:absolute;left:8%;right:2%;bottom:-1%;height:9%;z-index:-1;background:radial-gradient(closest-side,rgba(130,60,78,.22),rgba(130,60,78,0));filter:blur(6px)}
#stage{display:block;width:100%;height:100%;cursor:pointer}

.note{position:absolute;z-index:3;left:clamp(24px,5vw,84px);top:50%;transform:translateY(-50%);max-width:240px}
.hi{display:block;font-size:clamp(22px,2.1vw,30px);font-weight:600;letter-spacing:-.015em;line-height:1.15}
.role{display:block;margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hint{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:13px;font-weight:500;color:var(--muted)}
.cur{position:relative;width:22px;height:22px;flex:none}
.cur svg{position:absolute;left:3px;top:1px;width:15px;height:15px;animation:nudge 2.8s ease-in-out infinite}
.cur i{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;border:1px solid rgba(140,93,105,.45);animation:ring 2.8s ease-out infinite}
@keyframes nudge{0%,100%{transform:translate(0,0)}30%{transform:translate(-5px,1px)}70%{transform:translate(9px,-1px)}}
@keyframes ring{0%,25%{transform:scale(.6);opacity:0}45%{opacity:.9}100%{transform:scale(1.5);opacity:0}}

.bubble{position:absolute;z-index:4;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:500;letter-spacing:.02em;white-space:nowrap;
  background:rgba(255,255,255,.86);color:var(--ink);box-shadow:0 8px 24px rgba(120,50,65,.13);opacity:0;transform:translateY(5px);
  transition:opacity .35s ease,transform .35s ease;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bubble.on{opacity:1;transform:none}
.bubble[data-side=l]{left:0%;top:16%}
.bubble[data-side=r]{left:70%;top:14%}
.bubble[data-side=c]{left:57%;top:9%}
.bubble a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;pointer-events:auto}
.bubble svg{width:11px;height:11px}

@media (max-width:820px){
  :root{--nav-h:64px}
  .hero{display:flex;flex-direction:column;align-items:center;padding-top:var(--nav-h);
    background:linear-gradient(90deg,#d0a0aa 0%,#ecd0d5 22%,#fff 50%,#ecd0d5 78%,#d0a0aa 100%)}
  .hero::before{background:radial-gradient(ellipse 80% 48% at 50% 62%,#fff 0%,rgba(255,255,255,.95) 45%,rgba(255,255,255,0) 100%)}
  .note{position:static;transform:none;text-align:center;max-width:none;margin:14px 20px 0}
  .hi{font-size:24px}
  .hint{justify-content:center;margin-top:12px}
  .wrap{position:relative;left:auto;bottom:auto;transform:none;width:100vw;height:auto;margin-top:auto}
  .bubble[data-side=c],.bubble[data-side=l],.bubble[data-side=r]{left:50%;top:6%;transform:translate(-50%,5px)}
  .bubble.on{transform:translate(-50%,0)}
}
@media (prefers-reduced-motion:reduce){.cur svg,.cur i{animation:none}}
</style>
</head>
<body>
<header class="nav"><a href="#">Selva</a><nav><a href="#portfolio">Work</a><a href="#about">About</a><a href="#contact">Contact</a></nav></header>

<section class="hero" id="hero">
  <div class="note">
    <span class="hi">I'm Selva</span>
    <span class="role">Amazon Account Manager</span>
    <p class="hint"><span class="cur" aria-hidden="true"><i></i><svg viewBox="0 0 16 16"><path d="M2 1.5l11 5.2-4.6 1.4L6.6 13z" fill="#8c5d69"/></svg></span><span class="hint-text">Move cursor to call me !</span></p>
  </div>
  <div class="wrap">
    <canvas id="stage" role="img" aria-label="Animated illustration of Selva working at his laptop"></canvas>
    <p class="bubble" data-side="c" aria-live="polite"></p>
  </div>
</section>

<script>
/* Portable hero: mountHero(rootEl, {counts, base | frames}) -> destroy().
   In React: call it in useEffect with a ref and return the destroy function. */
function mountHero(root,opt){
  const C=opt.counts,FPS=12,base=opt.base||'frames/',$=s=>root.querySelector(s);
  const cv=$('#stage'),ctx=cv.getContext('2d'),wrap=$('.wrap'),bub=$('.bubble'),hintEl=$('.hint-text');
  const ghost=document.createElement('canvas'),gx=ghost.getContext('2d');
  const mob=matchMedia('(max-width:820px)'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const touch=matchMedia('(hover:none)').matches;
  if(touch||mob.matches)hintEl.textContent='Tap to call me !';
  const REACT={left:{n:'left',peak:30,hold:[30,C.left-1]},right:{n:'right',peak:28,hold:[28,C.right-1]}};
  const GREET=['g1','g2','g3'];
  const imgs={};let W=0,H=0,ghostA=0,ready=false,S={mode:'idle',n:'idle',t:0,dir:1},zone=null,pend=0,bt=0,raf=0,last=0;

  const url=(n,i)=>opt.frames?opt.frames[n][i]:base+n+'_'+String(i).padStart(2,'0')+'.webp';
  const load=n=>Promise.all(Array.from({length:C[n]},(_,i)=>{const im=new Image();im.src=url(n,i);return im.decode().then(()=>im,()=>im)})).then(a=>imgs[n]=a);

  function say(t,side,link){
    clearTimeout(bt);bub.classList.remove('on');if(!t)return;
    bt=setTimeout(()=>{bub.dataset.side=side||'c';
      bub.innerHTML=link?'<a href="#portfolio">'+t+'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4 4 4-4"/></svg></a>':t;
      bub.classList.add('on')},170);
  }
  function snap(){if(!W)return;gx.clearRect(0,0,W,H);gx.drawImage(cv,0,0);ghostA=1}
  function toIdle(){snap();S={mode:'idle',n:'idle',t:0,dir:1}}
  function trigger(z){
    if(!ready)return;
    if(z==='center'){
      if(S.mode==='greet'||!(imgs.g1&&imgs.g2&&imgs.g3))return;
      snap();S={mode:'greet',n:'g1',t:0,gi:0};say("Hey, it's you!",'c');
    }else{
      const R=REACT[z];if(!imgs[R.n]||(S.mode==='react'&&S.z===z))return;
      snap();S={mode:'react',z,n:R.n,t:0,phase:'in',dir:1};
      say(z==='left'?'Anyone here on the left?':'Anyone here on the right?',z[0]);
    }
  }
  function step(dt,now){
    const s=S,len=C[s.n];
    if(s.mode==='idle'){
      if(reduce)return;
      s.t+=s.dir*dt*FPS*.8;
      if(s.t>=len-1){s.t=len-1;s.dir=-1}else if(s.t<=0){s.t=0;s.dir=1}
    }else if(s.mode==='react'){
      const R=REACT[s.z];
      if(s.phase==='in'){s.t+=dt*FPS*1.5;if(s.t>=R.peak){s.phase='hold';s.dir=1;s.until=now+2300+Math.random()*500}}
      else if(s.phase==='hold'){
        s.t+=s.dir*dt*FPS*.7;
        if(s.t>=R.hold[1]){s.t=R.hold[1];s.dir=-1}else if(s.t<=R.hold[0]){s.t=R.hold[0];s.dir=1}
        if(now>s.until){s.phase='out';say('')}
      }else{s.t-=dt*FPS*1.7;if(s.t<=0)toIdle()}
    }else{
      s.t+=dt*FPS;
      if(s.n==='g2'&&s.t>=8&&!s.hi){s.hi=1;say('Hiiii!','c')}
      if(s.t>=len-1){
        if(s.gi<2){
          snap();s.gi++;s.n=GREET[s.gi];s.t=0;
          if(s.gi===2)say('Check out the portfolio','c',true);
        }else if(!s.until){s.t=len-1;s.until=now+1600}
        else if(now>s.until){say('');toIdle()}
      }
    }
  }
  function draw(){
    const L=imgs[S.n];if(!L||!W)return;
    const len=L.length,a=Math.max(0,Math.min(Math.floor(S.t),len-1)),b=Math.min(a+1,len-1),f=S.t-a;
    ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;ctx.drawImage(L[a],0,0,W,H);
    if(f>.01&&b!==a){ctx.globalAlpha=f;ctx.drawImage(L[b],0,0,W,H)}
    if(ghostA>0){ctx.globalAlpha=ghostA*ghostA*(3-2*ghostA);ctx.drawImage(ghost,0,0)}
    ctx.globalAlpha=1;
  }
  function frame(now){
    raf=requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000||0);last=now;
    step(dt,now);if(ghostA>0)ghostA=Math.max(0,ghostA-dt/.32);draw();
  }
  function size(){
    const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),w=Math.round(r.width*d),h=Math.round(r.height*d);
    if(w&&(w!==W||h!==H)){W=cv.width=ghost.width=w;H=cv.height=ghost.height=h;ghostA=0}
  }
  const zoneOf=x=>{const r=root.getBoundingClientRect(),p=(x-r.left)/r.width;return p<.34?'left':p>.66?'right':'center'};
  function onMove(e){
    if(e.pointerType==='touch'||mob.matches)return;
    const z=zoneOf(e.clientX);if(z===zone)return;
    zone=z;clearTimeout(pend);pend=setTimeout(()=>trigger(z),z==='center'?170:110);
  }
  function onLeave(){zone=null;clearTimeout(pend)}
  const onTap=()=>trigger('center');
  const ro=new ResizeObserver(size);ro.observe(cv);
  root.addEventListener('pointermove',onMove,{passive:true});root.addEventListener('pointerleave',onLeave);cv.addEventListener('click',onTap);

  load('idle').then(()=>{
    size();ready=true;wrap.classList.add('ready');raf=requestAnimationFrame(frame);
    return ['left','right','g1','g2','g3'].reduce((p,n)=>p.then(()=>load(n)),Promise.resolve());
  }).then(()=>{if(mob.matches)setTimeout(()=>trigger('center'),700)});

  return()=>{cancelAnimationFrame(raf);ro.disconnect();clearTimeout(pend);clearTimeout(bt);
    root.removeEventListener('pointermove',onMove);root.removeEventListener('pointerleave',onLeave);cv.removeEventListener('click',onTap)};
}
window.__F=null;
mountHero(document.getElementById('hero'),{counts:{"g1": 23, "g2": 49, "g3": 41, "idle": 37, "left": 49, "right": 41},frames:window.__F});
</script>
</body>
</html>
